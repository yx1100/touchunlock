name: TouchUnlock
options:
  bundleIdPrefix: local.touchunlock
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
packages:
  Core:
    path: .
targets:
  TouchUnlock:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Core
        product: DurianCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: TouchUnlock
        CFBundleDisplayName: TouchUnlock
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "12"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        NSBluetoothAlwaysUsageDescription: TouchUnlock connects to your fingerprint device over Bluetooth.
    entitlements:
      path: Support/TouchUnlock.entitlements
      properties:
        # 仅蓝牙。不申请 network.client / network.server，应用不联网。
        com.apple.security.device.bluetooth: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.touchunlock.TouchUnlock
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        # 默认用本机自签证书：这样「设备控制和数据访问」的授权按「bundle id + 证书」记，
        # 重新构建不会失效（adhoc 按每次变化的 CDHash 记，构建一次就要重新授权一次）。
        # 换成别的机器时把本地证书名改掉，或直接覆盖：
        #   xcodebuild CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES
        CODE_SIGN_IDENTITY: TouchUnlock Local Signing
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 关掉 Debug 的「主二进制 + .debug.dylib」拆分：自签证书没有 Team ID，
        # 而开启 hardened runtime 后库校验要求两者 Team ID 一致，拆分会直接启动失败。
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          # 不注入 get-task-allow，禁止调试器附加到进程读取内存里的密码。
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
